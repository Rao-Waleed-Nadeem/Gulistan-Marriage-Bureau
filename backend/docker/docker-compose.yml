# ==============================================================================
# Optional Local Database Docker Compose — Gulistan Marriage Bureau
# ==============================================================================
# IMPORTANT NOTICE:
# - Docker is STRICTLY OPTIONAL for daily development, builds, and automated tests.
# - Do NOT self-host production PostgreSQL in Docker at this stage (per ADR-003).
# - This compose file is provided solely for developers wishing to run an isolated
#   local PostgreSQL container for migration rehearsals.
# ==============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gulistan-local-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gulistan_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
